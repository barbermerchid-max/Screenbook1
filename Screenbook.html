"\", date: \"\", cinfo: \"\", notes: \"\", seq: 1, color: \"\", style: \"klasik\", stamp: \"\", stampSize: 140, stampDx: 0, stampDy: 0, logoSize: 56, logoDx: 0, logoDy: 0, logoMode: \"asli\", logoColor: \"#14181F\", logoBg: true, due: \"\", terms: \"\", showSt: false, lockBiz: false, qr: \"\", qrLabel: \"\", ribbon: false };\nlet INV = Object.assign(clone(INV0), load(K_INV, {}));\n// Cetak hanya jalan di halaman utuh (versi Windows). Di dalam artifact tombol cetak disembunyikan.\nconst CAN_PRINT = (() => { try { return window.top === window.self; } catch (e) { return false; } })();\n\n// Keadaan awal netral: belum ada model, jumlah, jenis, atau warna yang dipilih\nlet S = { anak: null, model: -1, vars: [], qty: 0, colors: {}, dtf: [], dts: {}, jc: {}, note: \"\", sizes: {}, manual: false, mprice: 0 };\nconst sizeTotal = it => Object.values(it.sizes || {}).reduce((a, b) => a + (Number(b) || 0), 0);\nlet editIdx = null, flash = \"\";\n\nconst rp = n => \"Rp \" + Math.round(n).toLocaleString(\"id-ID\");\nconst $ = s => document.querySelector(s);\nconst tierIndex = q => { if (q >= 1 && q < P.tiers[0][0]) return 0; return P.tiers.findIndex(t => q >= t[0] && q <= t[1]); };\nconst tierLabel = t => t[0] + \" – \" + t[1] + \" pcs\";\nconst price = (arr, ti) => (ti >= 0 && arr[ti] != null && arr[ti] !== \"\") ? Number(arr[ti]) : null;\nconst toggle = (arr, v) => { const i = arr.indexOf(v); i < 0 ? arr.push(v) : arr.splice(i, 1); };\n\nconst KIDS_DISC = 10000; // potongan harga kaos anak per pcs dari kaos dewasa\n/* Harga sablon satu posisi untuk c warna: diskon bertahap untuk warna ke-N dst, plafon sampai warna ke-capN */\nfunction colorCost(c, u, g, qty) {\n  const base = c * (u || 0), cd = P.cd;\n  if (!cd || !cd.on || !(u > 0) || !(c > 0) || (Number(cd.minQty) > 0 && Number(qty) < Number(cd.minQty))) return { amt: base, save: 0, capped: false, disc: false };\n  const steps = (cd.steps || []).map(x => [Number(x[0]) || 0, Number(x[1]) || 0]).sort((a, b) => a[0] - b[0]);\n  c d=\"hp-only\"${HP.only ? \" checked\" : \"\"}>Sablon saja (tanpa bahan kaos)<\/label><\/div><\/section>\n    ${HPP_G.map(([k, t]) => `<section class=\"card\"><h2>${t}<\/h2>${k === \"bahan\" && HP.only ? '<p class=\"note\" style=\"margin:0 0 10px\">Tidak dihitung karena mode \"Sablon saja\" aktif.<\/p>' : \"\"}<div id=\"hp-g-${k}\"><\/div><button class=\"btn alt\" type=\"button\" data-add=\"${k}\">+ Tambah kolom<\/button><\/section>`).join(\"\")}\n    <section class=\"card\"><h2>Tenaga kerja<\/h2>\n      <p class=\"note\" style=\"margin:0 0 10px\">Borongan: tarif per pcs, langsung masuk biaya per pcs. Harian: upah per orang per hari, dihitung dari jumlah orang dan lama kerja (jumlah pcs ÷ orang ÷ kapasitas, dibulatkan ke atas), lalu dibagi jumlah produksi. Hari kerja bisa diisi manual; kalau dikosongkan, dihitung otomatis dari kapasitas. Lembur diisi dalam jam per orang dan dibayar sesuai upah lembur per jam. Jangan isi dua kali: kalau upah jahit atau sablon dihitung di sini, kosongkan kolom upah yang sama di kelompok Produksi.<\/p>\n      <div class=\"row2\" style=\"margin-bottom:12px\"><label class=\"f\">Jam kerja standar per hari<input type=\"number\" inputmode=\"numeric\" min=\"1\" step=\"1\" data-k=\"jam\" value=\"${HP.jam || \"\"}\" placeholder=\"8\"><small style=\"font-weight:400\">Standar 8 jam. Dipakai untuk menghitung upah per jam.<\/small><\/label>${fld(\"lrate\", \"Upah lembur per jam (Rp)\", \"Awal Rp 10.000 per jam, bisa diubah\")}<\/div>\n      <div id=\"hp-tk\"><\/div>\n      <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px\"><button class=\"btn alt\" type=\"button\" data-tadd=\"b\">+ Borongan<\/button><button class=\"btn alt\" type=\"button\" data-tadd=\"h\">+ Harian<\/button><\/div>\n      <details style=\"margin-top:6px\"><summary style=\"cursor:pointer;font-weight:600;font-size:.88rem\">Panduan perkiraan tarif dan waktu kerja<\/summary>\n        <div style=\"overflow-x:auto;margin-top:8px\"><table style=\"border-collapse:collapse;font-size:.82rem;width:100%\"><thead><tr style=\"text-align:left;color:var(--muted)\"><th style=\"padding:5px 8px 5px 0\">Pekerjaan<\/th><th style=\"padding:5px 8px\">Borongan<\/th><th style=\"padding:5px 8px\">Harian<\/th><th style=\"padding:5px 0 5px 8px\">Kapasitas/orang/hari<\/th><\/tr><\/thead><tbody>\n          ${T(\"Potong kain\", \"Rp 500–1.500/pcs\", \"Rp 80–110 rb\", \"100–200 pcs\")}${T(\"Jahit oblong\", \"Rp 4.000–7.000/pcs\", \"Rp 90–140 rb\", \"25–40 pcs\")}${T(\"Jahit polo\", \"Rp 8.000–12.000/pcs\", \"Rp 100–150 rb\", \"12–20 pcs\")}${T(\"Jahit hodie / zipper\", \"Rp 15.000–25.000/pcs\", \"Rp 100–150 rb\", \"6–12 pcs\")}${T(\"Sablon plastisol (per warna, per sisi)\", \"Rp 500–1.500/pcs\", \"Rp 80–130 rb\", \"100–250 pcs\")}${T(\"Press DTF\", \"Rp 500–1.000/pcs\", \"Rp 70–110 rb\", \"150–300 pcs\")}${T(\"QC, finishing, lipat, packing\", \"Rp 500–1.500/pcs\", \"Rp 60–90 rb\", \"150–300 pcs\")}\n        <\/tbody><\/table><\/div>\n        <p class=\"note\" style=\"margin:10px 0 4px\"><b>Ini perkiraan kasar pasar konveksi, bukan angka resmi.<\/b> Tarif nyata beda tiap daerah, tingkat keahlian, dan kerumitan model. Cocokkan dengan penjahit atau tukang sablon langganan, dan cek upah minimum daerahmu.<\/p>\n        <p class=\"note\" style=\"margin:0 0 4px\">Rumus tarif borongan: target upah harian ÷ kapasitas per hari. Contoh: Rp 120.000 ÷ 30 pcs = Rp 4.000 per pcs.<\/p>\n        <p class=\"note\" style=\"margin:0\">Tambahkan cadangan waktu 10–20% untuk revisi, reject, dan pengeringan sablon.<\/p>\n      <\/details><\/section>\n    <section class=\"card\"><h2>Biaya persen dari harga jual<\/h2>\n      <p class=\"note\" style=\"margin:0 0 10px\">Biaya yang dipotong sebagai persen dari harga jual, misalnya potongan marketplace, komisi reseller, atau biaya payment. Nilainya ikut berubah saat harga jual berubah.<\/p>\n      <div id=\"hp-pc\"><\/div><button class=\"btn alt\" type=\"button\" data-pcadd=\"1\">+ Tambah biaya persen<\/button><\/section>\n    <section class=\"card\"><h2>Susut &amp; pengembangan kain<\/h2>\n      <p class=\"note\" style=\"margin:0 0 10px\">Susut: kain mengecil atau terbuang saat cuci dan potong, jadi kebutuhan kain bertambah. Pengembangan: kain melar saat dihampar, jadi kebutuhan berkurang. Keduanya mengubah biaya bahan per pcs. Angka ini bisa diganti di tiap order (tab Pesanan).<\/p>\n      <div class=\"row2\"><label class=\"f\">Susut kain (%)<input type=\"number\" inputmode=\"decimal\" min=\"0\" max=\"50\" step=\"0.5\" data-k=\"susut\" value=\"${HP.susut || \"\"}\" placeholder=\"0\"><small style=\"font-weight:400\">Contoh: 3 artinya kebutuhan bahan naik 3%<\/small><\/label><label class=\"f\">Pengembangan kain (%)<input type=\"number\" inputmode=\"decimal\" min=\"0\" max=\"50\" step=\"0.5\" data-k=\"kembang\" value=\"${HP.kembang || \"\"}\" placeholder=\"0\"><small style=\"font-weight:400\">Contoh: 2 artinya kebutuhan bahan turun 2%<\/small><\/label><\/div>\n      <div class=\"note\" id=\"hp-kf\" style=\"margin:10px 0 0\"><\/div><\/section>\n    <section class=\"card\"><h2>Penyusutan alat &amp; dana pengembangan<\/h2>\n      <p class=\"note\" style=\"margin:0 0 10px\">Penyusutan alat = harga beli ÷ umur pakai (bulan), lalu dibagi produksi rata-rata per bulan, jadi tiap pcs menanggung sebagian biaya alat. Dana pengembangan = persen dari biaya produksi yang disisihkan untuk tumbuh (alat baru, desain, promosi). Isi tiap baris: nama alat, harga beli (Rp), umur pakai (bulan).<\/p>\n      <div id=\"hp-dep\"><\/div>\n      <button class=\"btn alt\" type=\"button\" data-depadd=\"1\" style=\"margin-bottom:12px\">+ Tambah alat / mesin<\/button>\n      <div class=\"row2\"><label class=\"f\">Produksi rata-rata per bulan (pcs)<input type=\"number\" inputmode=\"numeric\" min=\"0\" step=\"1\" data-k=\"pbulan\" value=\"${HP.pbulan || \"\"}\" placeholder=\"0\"><small style=\"font-weight:400\">Untuk membagi penyusutan ke tiap pcs<\/small><\/label><label class=\"f\">Dana pengembangan usaha (%)<input type=\"number\" inputmode=\"decimal\" min=\"0\" max=\"100\" step=\"0.5\" data-k=\"dev\" value=\"${HP.dev || \"\"}\" placeholder=\"0\"><small style=\"font-weight:400\">Persen dari biaya produksi. Bisa diganti per order<\/small><\/label><\/div>\n      <div class=\"note\" id=\"hp-depsum\" style=\"margin:10px 0 0\"><\/div><\/section>\n    <section class=\"card\"><h2>Harga jual<\/h2>\n      <div class=\"row2\">${fld(\"margin\", \"Target margin (%)\", \"Markup di atas HPP untuk harga saran\")}${fld(\"jual\", \"Harga jual per pcs (Rp)\", \"Isi untuk melihat laba sebenarnya\")}<\/div><\/section>\n    <section class=\"card\"><h2>HPP per tingkat jumlah<\/h2><div id=\"hp-tbl\" style=\"overflow-x:auto\"><\/div><\/section>\n  <\/div>\n  <aside class=\"col\"><section class=\"card\" id=\"hp-out\" style=\"position:sticky;top:calc(var(--top-h,110px) + 12px)\"><\/section><\/aside><\/div>`;\n  function applyLock() {\n    const on = !!HP.lock;\n    el.classList.toggle(\"hp-locked\", on);\n    el.querySelectorAll('input[data-f=\"n\"]').forEach(x => { x.readOnly = on; });\n    el.querySelectorAll('select[data-f=\"t\"]').forEach(x => { x.disabled = on; });\n    const c = $(\"#hp-lock\");\n    if (c) { const tip = on ? \"Terkunci. Klik untuk membuka kunci\" : \"Kunci kolom agar tidak salah tekan\"; c.classList.toggle(\"on\", on); c.setAttribute(\"aria-pressed\", on ? \"true\" : \"false\"); c.dataset.tip = tip; c.setAttribute(\"aria-label\", tip); }\n  }\n  const rows = k => {\n    const L = HP.g[k];\n    $(\"#hp-g-\" + k).innerHTML = L.length ? L.map((e, i) => `<div class=\"row2\" style=\"grid-template-columns:minmax(0,1fr) 140px auto;align-items:center;margin-bottom:8px\"><input type=\"text\" data-g=\"${k}\" data-i=\"${i}\" data-f=\"n\" value=\"${esc(e.n || \"\")}\" placeholder=\"Nama kolom\" aria-label=\"Nama kolom\"><input type=\"number\" inputmode=\"numeric\" min=\"0\" step=\"500\" data-g=\"${k}\" data-i=\"${i}\" data-f=\"v\" value=\"${Math.round((Number(e.v) || 0) * 100) / 100 || \"\"}\" placeholder=\"Rp 0\" aria-label=\"Nominal Rp\"><button class=\"btn alt\" type=\"button\" data-del=\"${k}:${i}\" aria-label=\"Hapus kolom\">Hapus<\/button><\/div>`).join(\"\") : `<p class=\"note\" style=\"margin:0 0 8px\">Belum ada kolom. Tekan Tambah kolom.<\/p>`;\n    applyLock();\n  };\n  const tkRows = () => {\n    $(\"#hp-tk\").innerHTML = HP.tk.length ? HP.tk.map((e, i) => `<div style=\"border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:10px\">\n      <div class=\"row2\" style=\"grid-template-columns:repeat(auto-fit,minmax(130px,1fr));align-items:end\">\n        <label class=\"f\">Nama pekerjaan<input type=\"text\" data-t=\"${i}\" data-f=\"n\" value=\"${esc(e.n || \"\")}\" placeholder=\"Contoh: Penjahit\"><\/label>\n        <label class=\"f\">Sistem<select data-t=\"${i}\" data-f=\"t\"><option value=\"b\"${e.t === \"h\" ? \"\" : \" selected\"}>Borongan per pcs<\/option><option value=\"h\"${e.t === \"h\" ? \" selected\" : \"\"}>Harian<\/option><\/select><\/label>\n        <label class=\"f\">${e.t === \"h\" ? \"Upah per orang per hari (Rp)\" : \"Tarif per pcs (Rp)\"}<input type=\"number\" inputmode=\"numeric\" min=\"0\" step=\"500\" data-t=\"${i}\" data-f=\"r\" value=\"${e.r || \"\"}\" placeholder=\"0\"><\/label>\n        <label class=\"f\">Jumlah orang<input type=\"number\" inputmode=\"numeric\" min=\"1\" step=\"1\" data-t=\"${i}\" data-f=\"o\" value=\"${e.o || 1}\"><\/label>\n        <label class=\"f\">Kapasitas (pcs/orang/hari)<input type=\"number\" inputmode=\"numeric\" min=\"0\" step=\"1\" data-t=\"${i}\" data-f=\"k\" value=\"${e.k || \"\"}\" placeholder=\"0\"><\/label>\n        <label class=\"f\">Hari kerja<input type=\"number\" inputmode=\"numeric\" min=\"0\" step=\"1\" data-t=\"${i}\" data-f=\"h\" value=\"${e.h || \"\"}\" placeholder=\"Otomatis\"><\/label>\n        <label class=\"f\">Lembur (jam per orang)<input type=\"number\" inputmode=\"numeric\" min=\"0\" step=\"1\" data-t=\"${i}\" data-f=\"l\" value=\"${e.l || \"\"}\" placeholder=\"0\"><\/label>\n        <button class=\"btn alt\" type=\"button\" data-tdel=\"${i}\" aria-label=\"Hapus pekerjaan\">Hapus<\/button><\/div>\n      <div style=\"margin-top:6px;font-size:.78rem;color:var(--muted)\" id=\"hp-h-${i}\"><\/div><\/div>`).join(\"\") : `<p class=\"note\" style=\"margin:0 0 10px\">Belum ada tenaga kerja. Tekan + Borongan atau + Harian.<\/p>`;\n    applyLock();\n  };\n  const pcRows = () => {\n    $(\"#hp-pc\").innerHTML = HP.pc.length ? HP.pc.map((e, i) => `<div class=\"row2\" style=\"grid-template-columns:minmax(0,1fr) 110px auto;align-items:center;margin-bottom:8px\"><input type=\"text\" data-pc=\"${i}\" data-f=\"n\" value=\"${esc(e.n || \"\")}\" placeholder=\"Contoh: Potongan marketplace\" aria-label=\"Nama biaya persen\"><input type=\"number\" inputmode=\"decimal\" min=\"0\" max=\"90\" step=\"0.5\" data-pc=\"${i}\" data-f=\"v\" value=\"${e.v || \"\"}\" placeholder=\"% harga\" aria-label=\"Persen dari harga jual\"><button class=\"btn alt\" type=\"button\" data-pcdel=\"${i}\" aria-label=\"Hapus biaya persen\">Hapus<\/button><\/div>`).join(\"\") : `<p class=\"note\" style=\"margin:0 0 8px\">Belum ada biaya persen.<\/p>`;\n    applyLock();\n  };\n  const out = () => {\n    const r = hppCalc(), row = (l, v, b) => `<div style=\"display:flex;justify-content:space-between;gap:10px;padding:5px 0;${b ? \"font-weight:700;border-top:1px solid var(--line);margin-top:4px;padding-top:9px\" : \"\"}\"><span style=\"color:var(--muted)\">${l}<\/span><span style=\"font-family:var(--f-mono)\">${v}<\/span><\/div>`;\n    r.tj.forEach((x, i) => {\n      const h = $(\"#hp-h-\" + i), e = HP.tk[i]; if (!h) return;\n      const src = x.auto ? \"otomatis dari kapasitas\" : \"manual\", p = [];\n      if (e.t === \"h\") {\n        p.push(x.d > 0 ? `${x.d} hari kerja (${src}) × ${x.o} orang × ${rp(x.r)} = ${rp(x.c)}` : \"Isi hari kerja atau kapasitas supaya biaya harian terhitung\");\n        if (x.r > 0) p.push(`setara ${rp(x.r / r.jam)} per jam (${r.jam} jam/hari)`);\n      } else {\n        p.push(`Biaya ${rp(x.c)} untuk ${r.q} pcs`);\n        if (x.k > 0) p.push(`penghasilan ±${rp(x.r * x.k)} per orang per hari`);\n        if (x.d > 0) p.push(`±${x.d} hari kerja (${src})`);\n      }\n      if (x.l > 0) p.push(`lembur ${x.l} jam × ${x.o} orang × ${rp(r.lrate)} = ${rp(x.ot)}`);\n      h.textContent = p.join(\" · \");\n    });\n    { const kfE = $(\"#hp-kf\"), dsE = $(\"#hp-depsum\");\n      if (kfE) kfE.textContent = r.sus > 0 || r.kem > 0 ? `Kebutuhan bahan efektif ${+(r.kf * 100).toFixed(2)}% dari dasar (susut ${r.sus}%, pengembangan ${r.kem}%).` : \"\";\n      if (dsE) dsE.textContent = r.depMon > 0 ? (r.pb > 0 ? `Penyusutan ${rp(r.depMon)} per bulan ÷ ${r.pb} pcs = ${rp(r.depMon / r.pb)} per pcs.` : `Penyusutan ${rp(r.depMon)} per bulan. Isi produksi per bulan supaya terhitung per pcs.`) : \"\"; }\n    $(\"#hp-out\").innerHTML = `<h2>Hasil HPP<\/h2>\n      <div style=\"font-size:.8rem;color:var(--muted)\">HPP per kaos<\/div>\n      <div style=\"font-family:var(--f-display);font-size:2.4rem;font-weight:700;line-height:1.1;color:var(--accent)\">${rp(r.hpp)}<\/div>\n      ${r.f > 0 ? `<div style=\"font-size:.74rem;color:var(--muted)\">Termasuk biaya persen pada harga ${r.jual > 0 ? \"jual\" : \"saran\"} ${rp(r.pref)}<\/div>` : \"\"}\n      <div style=\"margin:12px 0\">${row(\"Bahan + produksi per pcs\", rp(r.bp))}${row(\"Tenaga kerja per pcs\", rp(r.tkpcs))}${r.bahanAdj !== 0 ? row(r.bahanAdj > 0 ? \"Tambahan bahan (susut kain)\" : \"Hemat bahan (pengembangan)\", rp(r.bahanAdj)) : \"\"}${r.lj > 0 ? row(\"· termasuk lembur \" + r.lj + \" jam\", rp(r.lc / r.q) + \" /pcs\") : \"\"}${row(\"Biaya batch per pcs\", rp(r.batch))}${r.depPcs > 0 ? row(\"Penyusutan alat per pcs\", rp(r.depPcs)) : \"\"}${r.devAmt > 0 ? row(\"Dana pengembangan \" + +r.dev.toFixed(2) + \"%\", rp(r.devAmt)) : \"\"}${row(\"Cadangan reject\", rp(r.rejAmt))}${r.f > 0 ? row(\"Biaya persen \" + +(r.f * 100).toFixed(2) + \"% × \" + rp(r.pref), rp(r.fee)) : \"\"}${row(\"Tota
